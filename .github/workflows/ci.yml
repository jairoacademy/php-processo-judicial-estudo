name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior, que ficou obsoleta
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio: o pipeline só lê o repositório
permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # MySQL real para os testes de integração (o mesmo banco do ambiente Docker)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: processo_test
          MYSQL_USER: processo
          MYSQL_PASSWORD: processo
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: processo
      DB_USER: processo
      DB_PASSWORD: processo

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl
          coverage: none
          tools: composer:v2

      - name: Validar o composer.json
        run: composer validate --strict --no-check-publish

      - name: Descobrir a pasta de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dos pacotes do Composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Instalar as dependências (versões do composer.lock)
        run: composer install --prefer-dist --no-progress

      - name: Auditoria de segurança das dependências
        run: composer audit

      - name: Estilo de código (PHP-CS-Fixer)
        run: composer cs

      - name: Análise estática (PHPStan)
        run: composer stan

      - name: Testes (PHPUnit; aplica as migrations no banco de testes antes)
        run: composer test

      - name: Migrations reversíveis (desfaz tudo e aplica de novo)
        env:
          DB_NAME: processo_test
        run: |
          vendor/bin/doctrine-migrations migrate first --no-interaction
          vendor/bin/doctrine-migrations migrate --no-interaction

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Construir as imagens base e dev
        run: |
          docker build --target base -f docker/php/Dockerfile -t processo-php:base .
          docker build --target dev -f docker/php/Dockerfile -t processo-php:dev .
