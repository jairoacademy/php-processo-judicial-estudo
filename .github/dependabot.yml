# Abre PRs semanais com atualizações das dependências; cada PR passa pelo CI
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      ferramentas-de-desenvolvimento:
        dependency-type: development
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
    commit-message:
      prefix: build
