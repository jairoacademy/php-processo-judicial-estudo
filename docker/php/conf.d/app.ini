; Configuração comum (todos os ambientes)
date.timezone = America/Sao_Paulo
default_charset = UTF-8
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off

; OPcache: guarda o bytecode compilado em memória compartilhada
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
